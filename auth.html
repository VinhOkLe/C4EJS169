<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHub - Đăng Nhập & Đăng Ký</title>
  <!-- Google Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <h2>StudyHub</h2>
        <p>Hệ thống Quản lý Học tập Thông minh</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tab-btn-login">Đăng Nhập</button>
        <button type="button" class="auth-tab-btn" id="tab-btn-register">Đăng Ký</button>
      </div>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="form-login" class="auth-form active">
        <div class="form-group">
          <label for="login-identifier">Email hoặc Tên người dùng</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="login-identifier" placeholder="Nhập Email hoặc Họ tên..." required>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Mật khẩu</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" placeholder="Nhập mật khẩu..." required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-btn-submit">
          <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
        </button>

        <div class="auth-divider">
          <span>HOẶC</span>
        </div>

        <button type="button" class="btn-guest" onclick="loginAsGuest()">
          <i class="fa-solid fa-bolt"></i> Dùng thử nhanh (Không cần tài khoản)
        </button>

        <div class="auth-hint-box">
          <i class="fa-solid fa-circle-info" style="color: var(--primary);"></i>
          <strong>Tài khoản Demo sẵn:</strong><br>
          • Đăng nhập theo Tên: <code>Sinh viên MindX</code><br>
          • Hoặc theo Email: <code>demo@studyhub.vn</code><br>
          • Mật khẩu: <code>123</code>
        </div>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="form-register" class="auth-form">
        <div class="form-group">
          <label for="reg-fullname">Họ và tên học viên</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="reg-fullname" placeholder="VD: Nguyễn Văn A" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email học tập</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="reg-email" placeholder="VD: sinhvien@mindx.edu.vn" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password">Mật khẩu</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="reg-password" placeholder="Tạo mật khẩu (từ 3 ký tự)..." required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-repassword">Nhập lại mật khẩu</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-shield-halved"></i>
            <input type="password" id="reg-repassword" placeholder="Nhập lại chính xác mật khẩu..." required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-btn-submit">
          <i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản
        </button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>

</html>
