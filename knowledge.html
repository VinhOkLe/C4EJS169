<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHub - Kho Kiến Thức</title>
  <!-- Google Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-layout">
    <!-- Sidebar / Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="brand-text">
          <h2>StudyHub</h2>
          <span>Quản lý học tập</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="nav-menu">
        <a href="index.html" class="nav-link">
          <i class="fa-solid fa-house"></i>
          <span>Trang chủ</span>
        </a>
        <a href="schedule.html" class="nav-link">
          <i class="fa-regular fa-calendar-days"></i>
          <span>Lịch học & Lưu ý</span>
        </a>
        <a href="todo.html" class="nav-link">
          <i class="fa-solid fa-list-check"></i>
          <span>Todo & Deadline</span>
          <span class="badge" id="pending-count">0</span>
        </a>
        <a href="knowledge.html" class="nav-link active">
          <i class="fa-solid fa-book-bookmark"></i>
          <span>Kho Kiến thức</span>
        </a>
      </nav>

      <!-- Sidebar Footer (Thông tin user & Thời gian) -->
      <div class="sidebar-footer">
        <div class="user-profile-box">
          <div class="user-avatar"><img src="user.png" alt="Avatar"></div>
          <div class="user-details">
            <span class="user-name" id="user-display-name">Học viên</span>
            <span class="user-email" id="user-display-email">demo@studyhub.vn</span>
          </div>
          <button class="btn-logout" onclick="logout()" title="Đăng xuất tài khoản">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>

        <div class="today-box">
          <i class="fa-regular fa-clock"></i>
          <div>
            <div id="current-day-text" class="day-text">Thứ ...</div>
            <div id="current-date-text" class="date-text">--/--/----</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top header bar -->
      <header class="top-header">
        <div class="header-titles">
          <h1>Kho Kiến thức</h1>
          <p>Lưu trữ ghi chú bài học theo môn học, tuần học và đánh dấu độ quan trọng</p>
        </div>
        <div class="header-actions">
          <button id="btn-add-knowledge" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> <span>Thêm ghi chú</span>
          </button>
        </div>
      </header>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="filter-group">
          <select id="knowledge-subject-filter" class="select-input">
            <option value="all">Tất cả môn học</option>
          </select>
          <select id="knowledge-priority-filter" class="select-input">
            <option value="all">Mọi mức độ quan trọng</option>
            <option value="high">⭐⭐⭐ Rất quan trọng / Trọng tâm thi</option>
            <option value="medium">⭐⭐ Quan trọng</option>
            <option value="low">⭐ Đọc thêm / Tham khảo</option>
          </select>
        </div>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="knowledge-search" placeholder="Tìm theo tuần, chủ đề, ghi chú...">
        </div>
      </div>

      <!-- Knowledge Cards Grid -->
      <div class="cards-grid knowledge-grid" id="knowledge-list">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <!-- MODAL: THÊM / SỬA KHO KIẾN THỨC -->
  <div class="modal" id="modal-knowledge">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="knowledge-modal-title">Thêm Ghi Chú Kiến Thức</h3>
        <button class="modal-close" onclick="closeModal('modal-knowledge')">&times;</button>
      </div>
      <form id="form-knowledge" class="modal-body">
        <input type="hidden" id="knowledge-id">
        <div class="form-row">
          <div class="form-group">
            <label for="knowledge-subject">Môn học <span class="required">*</span></label>
            <input type="text" id="knowledge-subject" placeholder="VD: Lập trình Java, Web 1, Mạng máy tính..."
              required>
          </div>
          <div class="form-group">
            <label for="knowledge-week">Tuần học / Buổi <span class="required">*</span></label>
            <input type="text" id="knowledge-week" placeholder="VD: Tuần 2 hoặc Buổi 5" required>
          </div>
        </div>
        <div class="form-group">
          <label for="knowledge-title">Chủ đề kiến thức <span class="required">*</span></label>
          <input type="text" id="knowledge-title" placeholder="VD: Xử lý ngoại lệ Exception Handling" required>
        </div>
        <div class="form-group">
          <label for="knowledge-priority">Đánh dấu độ quan trọng <span class="required">*</span></label>
          <select id="knowledge-priority" required>
            <option value="high">⭐⭐⭐ Rất quan trọng / Trọng tâm thi</option>
            <option value="medium" selected>⭐⭐ Quan trọng</option>
            <option value="low">⭐ Đọc thêm / Mở rộng</option>
          </select>
        </div>
        <div class="form-group">
          <label for="knowledge-content">Nội dung ghi chú & Công thức</label>
          <textarea id="knowledge-content" rows="4"
            placeholder="VD: Cú pháp try-catch-finally, các Exception thường gặp (NullPointerException, ArrayIndexOutOfBoundsException)..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-knowledge')">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu Kiến Thức</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>

</html>
